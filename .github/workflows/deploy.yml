# push 到 main 時：先跑測試，通過才部署到 Cloud Run。
# 認證用 Workload Identity Federation，沒有任何長期金鑰。
# 需要的 repo Variables：GCP_PROJECT、GCP_WIF_PROVIDER、GCP_DEPLOY_SA（由 scripts/setup-cicd.sh 輸出）

name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build dashboard
        run: npm run build:web

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # 只更新程式；環境變數與 Secret 沿用 Cloud Run 上的設定
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ga4-mcp \
            --source . \
            --region asia-east1 \
            --project "${{ vars.GCP_PROJECT }}" \
            --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ga4-mcp --region asia-east1 --project "${{ vars.GCP_PROJECT }}" --format='value(status.url)')
          test "$(curl -s "$URL/health")" = "ok"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/dashboard/summary")" = "401"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' "$URL/dashboard")" = "$URL/dashboard/login"
          echo "Deployed and healthy: $URL"
